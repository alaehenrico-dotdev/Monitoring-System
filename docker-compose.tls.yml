# HTTPS overlay. Run with:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
#
# Needs certs/fullchain.pem + certs/privkey.pem (see PRODUCTION.md for a real
# certificate, or the self-signed one-liner for local testing), and
# CLIENT_ORIGIN=https://<your host> in .env.
services:
  web:
    build:
      args:
        NGINX_CONF: deploy/nginx/docker-tls.conf
    ports: !override
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
