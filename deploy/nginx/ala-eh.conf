# Ala Eh Stocks Monitoring System - the Nginx site (the Nginx version of deploy/caddy/Caddyfile).
#
# What it does: serves the built client, proxies /api, /health and the /ws WebSocket to the API on
# 127.0.0.1:4000, and sends the security headers. See docs/DEPLOY-VPS.md for the full walkthrough.
#
# Install (COPY it, do not symlink it: Certbot edits this file to add HTTPS, and that must not
# end up as a change in your git checkout):
#   sudo cp /var/www/ala-eh/deploy/nginx/ala-eh.conf /etc/nginx/sites-available/ala-eh
#   sudo nano /etc/nginx/sites-available/ala-eh        # set server_name below
#   sudo ln -s /etc/nginx/sites-available/ala-eh /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d stocks.yourdomain.com      # adds HTTPS + the redirect
#
# If the app is not in /var/www/ala-eh, change every /var/www/ala-eh below. If the API listens on a
# port other than 4000 (PORT in server/.env), change the three proxy_pass lines.

server {
    listen 80;
    listen [::]:80;
    server_name stocks.yourdomain.com;

    root /var/www/ala-eh/client/dist;
    index index.html;

    server_tokens off;
    # The API's own JSON limit is 1 MB; a little room here lets Express answer with its clean 413.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    include /var/www/ala-eh/deploy/nginx/ala-eh-security.conf;

    # ---- Restoring / downloading a backup: big bodies, long timeouts, streamed not buffered ----
    location ^~ /api/backup/ {
        client_max_body_size 520m;       # the app refuses restore files over 512 MB
        proxy_request_buffering off;     # stream the upload straight through
        proxy_buffering off;             # stream the download straight through
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:4000;
        include /var/www/ala-eh/deploy/nginx/ala-eh-proxy.conf;
    }

    # ---- The API ----
    location /api/ {
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:4000;
        include /var/www/ala-eh/deploy/nginx/ala-eh-proxy.conf;
    }

    # ---- Health checks (uptime monitors) ----
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:4000;
        include /var/www/ala-eh/deploy/nginx/ala-eh-proxy.conf;
    }
    location /health/ {
        access_log off;
        proxy_pass http://127.0.0.1:4000;
        include /var/www/ala-eh/deploy/nginx/ala-eh-proxy.conf;
    }

    # ---- Realtime updates (WebSocket). The server pings every 30 s, so an hour of silence is plenty. ----
    location = /ws {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- The client (the built files) ----
    # Never serve hidden files (but leave /.well-known for HTTPS certificate checks).
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Hashed files under /assets never change: cache them for a year.
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # The service worker and the manifest must always be re-checked, or a new version is never picked up.
    location = /sw.js {
        expires -1;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    # Unhashed images in /public (logo, icons): a day is long enough to skip re-downloads, short
    # enough that a replaced logo shows up soon.
    location ~* \.(png|ico|jpg|jpeg|gif|webp|webm|mp4)$ {
        expires 1d;
        try_files $uri =404;
    }

    # Pages are never cached; a route the client owns (e.g. /daily-report) falls back to index.html.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
