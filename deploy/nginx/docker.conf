# Plain-HTTP server for the Docker setup (docker-compose.yml). Use
# docker-compose.tls.yml for HTTPS - see PRODUCTION.md.
#
# HSTS only on HTTPS: browsers ignore it over HTTP, and sending it there would
# be misleading. Empty header values are not emitted by nginx.
map $scheme $ala_eh_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/ala-eh-app.conf;
}
