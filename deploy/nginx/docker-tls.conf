# HTTPS server for the Docker setup (docker-compose.tls.yml). Expects
# certs/fullchain.pem and certs/privkey.pem mounted at /etc/nginx/certs.
map $scheme $ala_eh_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# Everything on plain HTTP goes to HTTPS. (Assumes the standard ports; if you
# publish HTTPS on another port, change the target below to include it.)
server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/ala-eh-app.conf;
}
