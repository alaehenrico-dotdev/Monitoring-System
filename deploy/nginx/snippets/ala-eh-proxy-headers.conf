# For proxied (API / WebSocket) locations: the Express app sets some of the
# same security headers (helmet). Drop its copies so each header is sent once,
# by nginx - in particular HSTS, which must only go out over HTTPS.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;
