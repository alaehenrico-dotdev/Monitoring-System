# Security response headers. Include this in the server block AND in every
# location that sets its own add_header: nginx does not inherit add_header
# into a location that declares one, so without the include those locations
# would silently ship without these headers.
#
# Needs this once in the http context (the Docker config and the VPS example
# both declare it) so HSTS is only sent over HTTPS, where browsers honour it:
#   map $scheme $ala_eh_hsts { https "max-age=31536000; includeSubDomains"; default ""; }
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security $ala_eh_hsts always;
# Same policy the build embeds as a <meta> tag (client/vite.config.ts), plus
# frame-ancestors/form-action, which only work as a header. style-src keeps
# 'unsafe-inline' because every component styles itself with inline style
# attributes; script-src has no such exception. connect-src names this host
# for the realtime WebSocket instead of allowing any wss: origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
