# The app itself - static client, API proxy, WebSocket. Shared by the plain
# HTTP and the HTTPS server blocks (docker.conf / docker-tls.conf) so the two
# cannot drift apart. Included inside a `server {}` block.
root /usr/share/nginx/html;
index index.html;

# Don't advertise the nginx version (headers and error pages).
server_tokens off;

include /etc/nginx/snippets/ala-eh-security-headers.conf;

# The built bundle is ~1.3 MB uncompressed and ~430 KB gzipped, and the API
# returns JSON stock tables that compress just as well. Compression runs here
# at the edge rather than in Node so it costs nginx CPU, not the API process.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    text/css
    text/javascript
    text/plain;

location = /index.html {
    include /etc/nginx/snippets/ala-eh-security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location = /sw.js {
    include /etc/nginx/snippets/ala-eh-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location /assets/ {
    include /etc/nginx/snippets/ala-eh-security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}

location = /health {
    proxy_pass http://api:4000;
    include /etc/nginx/snippets/ala-eh-proxy-headers.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /health/live {
    proxy_pass http://api:4000;
    include /etc/nginx/snippets/ala-eh-proxy-headers.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/backup/restore {
    client_max_body_size 520m;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://api:4000;
    include /etc/nginx/snippets/ala-eh-proxy-headers.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    proxy_pass http://api:4000;
    include /etc/nginx/snippets/ala-eh-proxy-headers.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /ws {
    proxy_pass http://api:4000;
    include /etc/nginx/snippets/ala-eh-proxy-headers.conf;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
}
