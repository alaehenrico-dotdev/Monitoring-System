# Security headers for the Ala Eh site - the same set deploy/caddy/Caddyfile sends.
#
# Included ONCE, at the top of the server block in ala-eh.conf. nginx does not inherit add_header
# into a location that defines its own add_header, so no location in ala-eh.conf sets one (cache
# lifetimes use `expires`, which does not have that problem). If you ever add an add_header to a
# location, include this file there too.
#
# This file lives in the repo, so a `git pull` updates it; then run: sudo nginx -t && sudo systemctl reload nginx
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# The same policy the build embeds as a <meta> tag (client/vite.config.ts), plus frame-ancestors and
# form-action, which only work as a header. style-src keeps 'unsafe-inline' because components style
# themselves with inline style attributes; script-src has no such exception. connect-src names this
# host for the realtime WebSocket instead of allowing any wss: origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
# Browsers ignore HSTS on plain HTTP, so it only takes effect once Certbot has added HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
