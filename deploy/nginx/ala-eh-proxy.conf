# What every proxied location (API, health) shares. Included from ala-eh.conf.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# The API trusts these only from a loopback proxy (TRUST_PROXY, default "loopback"), which is exactly
# this nginx: it is what makes the login limits count per visitor instead of one shared address.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# The API sends its own copies of some security headers (helmet). Drop them so each goes out once,
# from ala-eh-security.conf.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;
