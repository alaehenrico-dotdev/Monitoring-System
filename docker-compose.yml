# Usage:
#   cp .env.docker.example .env      (then edit the secrets)
#   docker compose up -d --build
# App is served on http://localhost:${WEB_PORT:-8080}
#
# For a real address with HTTPS, set in .env:
#   SITE_ADDRESS=stocks.example.com   (a domain pointing at this server)
#   CLIENT_ORIGIN=https://stocks.example.com
#   HTTP_PORT=80  HTTPS_PORT=443
# Caddy then gets and renews the certificate by itself - nothing else to set up.
#
# This PC only, no port in the address: set BIND_ADDRESS=127.0.0.1, HTTP_PORT=80,
# CLIENT_ORIGIN=http://localhost  ->  http://localhost
# Container logs rotate (3 x 10 MB each): Docker keeps them forever by default, which on a VPS
# slowly fills the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *logging
    image: mysql:8.0
    restart: unless-stopped
    # Hardening: a process in the container cannot gain privileges through a setuid
    # binary, and clients may not ask the server to read files from its disk
    # (LOAD DATA LOCAL INFILE is off by default in 8.0; this keeps it off on purpose).
    security_opt:
      - no-new-privileges:true
    command: ["--local-infile=0"]
    environment:
      MYSQL_DATABASE: ala_eh_stocks
      MYSQL_USER: alaeh_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    # Host access for MySQL Workbench. 3306 is for a native MySQL Server and
    # 3307 is used by another project's container, so use 3308.
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]

  api:
    logging: *logging
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # Hardening: the API runs as the unprivileged `node` user and needs no Linux
    # capabilities, so it keeps none and cannot gain any.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://alaeh_app:${DB_PASSWORD}@db:3306/ala_eh_stocks?connection_limit=10&pool_timeout=20
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      DATA_RESET_PASSCODE: ${DATA_RESET_PASSCODE:?set DATA_RESET_PASSCODE in .env}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      # Days a "Remember this device" sign-in lasts (0 = option off, max 90).
      REMEMBER_DEVICE_DAYS: ${REMEMBER_DEVICE_DAYS:-30}
      # Caddy reaches the API over the compose network, so trust that subnet
      # for X-Forwarded-For (per-visitor rate limiting).
      TRUST_PROXY: 172.28.0.0/16
      # Settings > Google Drive (docs/GOOGLE_DRIVE.md). Optional: with no client
      # id/secret the page just says the feature is not set up.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:${WEB_PORT:-8080}/api/drive/oauth/callback}
      DRIVE_TOKEN_KEY: ${DRIVE_TOKEN_KEY:-}
      # Optional: encrypts every backup the API writes (download, Drive, pre-migration
      # snapshots). Empty = plain backups. Generate: openssl rand -base64 32
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    # Snapshots taken before pending migrations are applied (server/docker/start.sh).
    volumes:
      - api_backups:/backups
    networks: [internal]

  web:
    logging: *logging
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    # Hardening: Caddy keeps one capability - binding ports 80 and 443 - and cannot
    # gain more.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on: [api]
    environment:
      # ":80" = plain HTTP on any host (the default). A domain name = automatic HTTPS.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      DEFAULT_SNI: ${SITE_ADDRESS:-localhost}
    ports:
      # BIND_ADDRESS=127.0.0.1 makes the app reachable from this PC only.
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-${WEB_PORT:-8080}}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-8443}:443"
    volumes:
      # The certificates Caddy obtained - kept across restarts so it does not
      # ask for new ones (and hit the issuer's rate limits) every time.
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  db_data:
  api_backups:
  caddy_data:
  caddy_config:

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/16
