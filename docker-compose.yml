# Usage:
#   cp .env.docker.example .env      (then edit the secrets)
#   docker compose up -d --build
# App is served on http://localhost:${WEB_PORT:-8080}
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ala_eh_stocks
      MYSQL_USER: alaeh_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    # Host access for MySQL Workbench. 3306 is for a native MySQL Server and
    # 3307 is used by another project's container, so use 3308.
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://alaeh_app:${DB_PASSWORD}@db:3306/ala_eh_stocks?connection_limit=10&pool_timeout=20
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      DATA_RESET_PASSCODE: ${DATA_RESET_PASSCODE:?set DATA_RESET_PASSCODE in .env}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      # nginx reaches the API over the compose network, so trust that subnet
      # for X-Forwarded-For (per-visitor rate limiting).
      TRUST_PROXY: 172.28.0.0/16
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT:-8080}:80"
    networks: [internal]

volumes:
  db_data:

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/16
