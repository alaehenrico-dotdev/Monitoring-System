name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Placeholder values for CI only - no real database or secrets are
      # needed here. `prisma generate` only parses this connection string
      # (it doesn't connect), and every test mocks the repositories it
      # touches rather than hitting a real DB. The secrets below deliberately
      # avoid config/env.ts's own placeholder denylist (see that file) - a
      # value like "changeme" here would fail the exact guard item 2 added.
      DATABASE_URL: "mysql://root:root@localhost:3306/ala_eh_stocks_ci"
      JWT_SECRET: "ci-only-jwt-secret-not-used-anywhere-real"
      DATA_RESET_PASSCODE: "ci-only-passcode-not-used-anywhere-real"
      CLIENT_ORIGIN: "http://localhost:5173"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (both workspaces)
        run: npm ci

      - name: Audit production dependencies for known high-severity vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Check migrations for unreviewed data-risky statements
        run: npm run check:migrations

      - name: Typecheck (the server build leaves tests out, so this is what checks them)
        run: npm run typecheck

      - name: Test (both workspaces)
        run: npm test

      - name: Build (both workspaces)
        run: npm run build

  end-to-end:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ala_eh_stocks_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/ala_eh_stocks_e2e
      JWT_SECRET: "ci-e2e-jwt-secret-not-used-anywhere-real"
      DATA_RESET_PASSCODE: "482913"
      CLIENT_ORIGIN: http://localhost:5173
      SEED_ADMIN_PASSWORD: "E2eAdmin-Only-Password-8492"
      SEED_ENCODER_PASSWORD: "E2eEncoder-Only-Password-8492"
      E2E_DATABASE_NAME: ala_eh_stocks_e2e
      E2E_ALLOW_DESTRUCTIVE_RESTORE: I_HAVE_A_DISPOSABLE_E2E_DATABASE
      E2E_RESET_PASSCODE: "482913"
      E2E_ADMIN_PASSWORD: "E2eAdmin-Only-Password-8492"
      E2E_ENCODER_PASSWORD: "E2eEncoder-Only-Password-8492"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install MySQL client utilities for backup and restore
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Apply schema migrations
        run: npm run prisma:migrate:deploy --workspace server
      - name: Seed isolated E2E accounts and products
        run: npm run seed --workspace server
      - name: Exercise login, permissions, stock, and restore workflows
        run: npm run e2e

  # The browser tests get their own database (and job): the API end-to-end script above
  # resets the seeded accounts' passwords as part of what it checks, and sharing one
  # database would make the two fight over them.
  browser-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ala_eh_stocks_browser
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/ala_eh_stocks_browser
      JWT_SECRET: "ci-browser-jwt-secret-not-used-anywhere-real"
      DATA_RESET_PASSCODE: "482913"
      # The browser reaches the API through the preview server on 4173 (same origin).
      CLIENT_ORIGIN: http://localhost:4173
      SEED_ADMIN_PASSWORD: "BrowserAdmin-Only-Password-8492"
      SEED_ENCODER_PASSWORD: "BrowserEncoder-Only-Password-8492"
      E2E_REAL: "1"
      E2E_ADMIN_PASSWORD: "BrowserAdmin-Only-Password-8492"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply schema migrations
        run: npm run prisma:migrate:deploy --workspace server
      - name: Seed the browser-test accounts and products
        run: npm run seed --workspace server
      - name: Build the API (the tests start it the way production does)
        run: npm run build --workspace server
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (every theme, sign-in, every page, the live connection)
        run: npm run e2e:browser
      - name: Keep the screenshots and the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-output
          path: |
            e2e-browser/screenshots
            e2e-browser/report
          retention-days: 14
