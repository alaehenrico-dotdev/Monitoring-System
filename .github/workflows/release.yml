name: Release desktop app

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    # Needed when RELEASE_TOKEN is not configured. A fine-grained PAT or GitHub
    # App token can be supplied as RELEASE_TOKEN if repository/organization
    # policy blocks GITHUB_TOKEN from creating releases.
    permissions:
      contents: write
    env:
      # prisma generate (server's postinstall) only parses this - it never
      # connects - same placeholder pattern as ci.yml. The server itself
      # isn't built or shipped here; this just lets a plain `npm ci` at the
      # repo root succeed without --ignore-scripts.
      DATABASE_URL: "mysql://root:root@localhost:3306/ala_eh_stocks_ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Install dependencies (both workspaces)
        run: npm ci

      # The server URL is baked into the build at compile time (see
      # TAURI_SETUP.md) - this writes the real production/LAN origin from a
      # repo secret into the .env file build:tauri reads, since .env.tauri
      # itself is gitignored (same reason .env/.env.local are).
      - name: Write production server URL
        shell: bash
        run: echo "VITE_API_URL=${{ secrets.TAURI_API_URL }}" > client/.env.tauri

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          tagName: ${{ github.ref_name }}
          releaseName: "Ala Eh Stocks Monitoring System ${{ github.ref_name }}"
          releaseBody: "See assets below to download and install this version."
          # Draft so a human reviews and publishes it - the updater's GitHub
          # endpoint (releases/latest) only ever resolves to a published,
          # non-prerelease release, so nothing reaches installed apps (or new
          # downloads) until someone clicks "Publish release".
          releaseDraft: true
          uploadUpdaterJson: true
          # We bundle both NSIS and MSI (tauri.conf.json); NSIS is the
          # lighter, more update-friendly format, so it's what latest.json
          # points the updater at.
          updaterJsonPreferNsis: true
